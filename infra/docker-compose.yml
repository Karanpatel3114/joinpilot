# Local services for JoinPilot: Postgres with pgvector, and Redis for background jobs.
#   docker compose -f infra/docker-compose.yml up -d     # start
#   docker compose -f infra/docker-compose.yml down      # stop (add -v to delete data)
# Then set DATABASE_URL and REDIS_URL in .env (see .env.example).
#
# The whole app in containers (API with its in-process worker, and the console):
#   docker compose -f infra/docker-compose.yml --profile app up -d --build --wait
#   open http://localhost:8080   (API on http://localhost:8000)
name: joinpilot

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: joinpilot
      POSTGRES_PASSWORD: joinpilot
      POSTGRES_DB: joinpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joinpilot -d joinpilot"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 192M

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://joinpilot:joinpilot@postgres:5432/joinpilot
      REDIS_URL: redis://redis:6379/0
      JOBS_MODE: arq
      CORS_ORIGINS: '["http://localhost:8080"]'
      DUCKDB_MEMORY_LIMIT: 256MB
      KPI__REFERENCE_DATE: "2026-06-30"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  app-data:
