name: CI

on:
  push:
    branches: [main, "m*-*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy backend/joinpilot eval
      - name: Tests
        run: uv run pytest -q
      - name: Evaluation smoke test (dev split; fails if a deterministic score drops below its floor)
        run: uv run python -m eval.run_all --split dev && uv run python -m eval.smoke

  integration:
    name: Integration (Postgres, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: joinpilot
          POSTGRES_PASSWORD: joinpilot
          POSTGRES_DB: joinpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U joinpilot -d joinpilot"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://joinpilot:joinpilot@localhost:5432/joinpilot
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Integration tests
        run: uv run pytest -q -m integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend
        run: uv sync --locked
      - name: Install web
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the happy path in a real browser
        working-directory: web
        run: npx playwright test
      - name: Keep the trace if it failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  web:
    name: Web (oxlint, tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/backend.Dockerfile
          tags: joinpilot-api:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/web.Dockerfile
          tags: joinpilot-web:ci
          load: true
          build-args: VITE_API_URL=http://localhost:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Run the API within a free-tier memory limit (512 MB)
        run: >-
          docker run -d --name api -m 512m -p 8000:8000
          -e DUCKDB_MEMORY_LIMIT=256MB -e DUCKDB_THREADS=1 joinpilot-api:ci
      - name: Wait for the API to be healthy
        run: timeout 90 sh -c 'until curl -sf localhost:8000/health; do sleep 1; done'
      - name: Smoke-test the API end to end
        run: python3 infra/smoke_api.py http://localhost:8000
      - name: Serve the console, including deep links
        run: |
          docker run -d --name web -p 8080:8080 joinpilot-web:ci
          timeout 30 sh -c 'until curl -sf localhost:8080/runs/any >/dev/null; do sleep 1; done'
          curl -sI localhost:8080/ | grep -i "x-frame-options: deny"
      - name: Show the API log if anything failed
        if: failure()
        run: docker logs api

