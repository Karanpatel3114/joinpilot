[project]
name = "joinpilot"
version = "0.1.0"
description = "Turn raw ERP tables and a plain-English requirement into a tested, human-approved data model."
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Karan Patel" }]
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp==2.3.0",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "sqlglot>=30.35.0",
    "uvicorn[standard]>=0.54.0",
]


[project.scripts]
joinpilot-mcp = "joinpilot.mcp_server.__main__:main"

[project.optional-dependencies]
tracing = [
    "langfuse>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/joinpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib -m 'not integration'"
markers = ["integration: needs Postgres or Redis (run with -m integration)"]
filterwarnings = [
    # Starlette suggests a renamed httpx fork for its TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # arq's worker calls redis-py's deprecated close() internally.
    "ignore:Call to deprecated close:DeprecationWarning:arq.worker",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
