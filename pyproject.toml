[project]
name = "joinpilot"
version = "0.1.0"
description = "Turn raw ERP tables and a plain-English requirement into a tested, human-approved data model."
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Karan Patel" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/joinpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --import-mode=importlib -m 'not integration'"
markers = ["integration: needs Postgres or Redis (run with -m integration)"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
